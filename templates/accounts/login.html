{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GV_PROJ - Login</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&family=Space+Grotesk:wght@500;700&display=swap");

    :root{
      --gv-900:#043c33;
      --gv-700:#0b6b57;
      --gv-500:#138a6f;
      --ink:#0f172a;
      --muted:#6b7280;
      --bg-1:#f5f8f6;
      --bg-2:#eaf2ef;
      --card:#ffffff;
      --border:rgba(2,6,23,.08);
      --shadow:0 40px 80px rgba(2,6,23,.16);
      --shadow-soft:0 18px 40px rgba(2,6,23,.12);
      --danger-bg:#fee2e2;
      --danger-bd:#fecaca;
      --danger-tx:#b91c1c;
    }

    body{
      margin:0;
      font-family:"Manrope","Segoe UI",Arial,sans-serif;
      background:
        radial-gradient(900px 420px at 10% -10%, #ffffff 0%, transparent 60%),
        radial-gradient(700px 420px at 100% 10%, rgba(11,107,87,.10) 0%, transparent 55%),
        linear-gradient(140deg, var(--bg-1), var(--bg-2));
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 16px;
      position:relative;
      overflow:hidden;
      color:var(--ink);
    }

    body::before{
      content:"";
      position:absolute;
      width:280px;
      height:280px;
      border-radius:80px;
      background:linear-gradient(140deg, rgba(11,107,87,.18), rgba(11,107,87,0));
      top:50px;
      left:-120px;
      filter:blur(2px);
      opacity:.8;
    }

    body::after{
      content:"";
      position:absolute;
      width:220px;
      height:220px;
      border-radius:60px;
      background:linear-gradient(130deg, rgba(255,255,255,.9), rgba(255,255,255,0));
      bottom:-80px;
      right:-40px;
      opacity:.7;
    }

    /* logo GE topo direito */
    .brand{
      position:fixed;
      top:16px;
      right:16px;
      z-index:10;

      padding:8px 10px;
      border-radius:18px;
      background: linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,255,255,.75));
      border: 1px solid rgba(11,107,87,.18);
      box-shadow: 0 16px 36px rgba(2,6,23,.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      opacity:.96;
    }

    .brand::after{
      content:"";
      position:absolute;
      inset:2px;
      border-radius:16px;
      border:1px solid rgba(11,107,87,.08);
      pointer-events:none;
    }

    .brand img{
      height:38px;
      width:auto;
      display:block;

      opacity:.97;
      filter: brightness(1.03) contrast(.98);
    }

    /* CARD */
    .card{
      width:min(520px, 92vw);
      padding:76px 36px 28px;
      border-radius:26px;
      background:var(--card);
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      position:relative;
      z-index:1;
    }

    .hero-icon{
      position:absolute;
      top:-30px;
      left:50%;
      width:64px;
      height:64px;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#eafff7;
      font-family:"Space Grotesk","Manrope",sans-serif;
      font-weight:800;
      font-size:22px;
      letter-spacing:.8px;
      z-index:2;
      pointer-events:none;
      text-shadow:0 6px 14px rgba(0,0,0,.18);
    }

    .card::before{
      content:"";
      position:absolute;
      top:-30px;
      left:50%;
      width:64px;
      height:64px;
      border-radius:18px;
      transform:translateX(-50%);
      background:linear-gradient(140deg, var(--gv-700), var(--gv-500));
      box-shadow:0 18px 36px rgba(11,107,87,.35);
    }

    .card::after{
      content:"";
      position:absolute;
      top:24px;
      left:50%;
      width:110px;
      height:5px;
      border-radius:999px;
      transform:translateX(-50%);
      background:rgba(11,107,87,.20);
    }

    /* pill (GEVERNOVA PROJETOS) */
    .pill{
      position:absolute;
      top:32px;
      left:50%;
      transform:translateX(-50%);
      background:linear-gradient(135deg, var(--gv-700), var(--gv-500));
      color:#fff;
      font-weight:900;
      letter-spacing:.4px;
      border-radius:999px;
      padding:8px 16px;
      font-size:11px;
      text-transform:uppercase;
      box-shadow:0 12px 28px rgba(0,0,0,.16);
      white-space:nowrap;
    }

    h1{
      margin:0 0 4px;
      font-family:"Space Grotesk","Manrope",sans-serif;
      font-size:32px;
      letter-spacing:.4px;
      color:var(--gv-700);
      font-weight:700;
    }

    .sub{
      margin:0 0 18px;
      color:var(--muted);
      font-size:13px;
    }

    .field{
      margin-top:14px;
    }

    label{
      display:block;
      font-weight:700;
      margin:0 0 6px;
      font-size:13px;
      color:#0b1324;
    }

    select, input{
      width:100%;
      height:48px;
      border:1px solid rgba(15,23,42,.12);
      border-radius:14px;
      padding:0 14px;
      font-size:14px;
      background:#f3f5f6;
      box-sizing:border-box;
      outline:none;
      transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    select:hover, input:hover{
      background:#f7f8f9;
    }

    select:focus, input:focus{
      border-color: rgba(11,107,87,.55);
      box-shadow: 0 0 0 4px rgba(19,138,111,.18);
      background:#fff;
    }

    .error{
      margin:14px 0 0;
      background:var(--danger-bg);
      border:1px solid var(--danger-bd);
      color:var(--danger-tx);
      padding:10px 12px;
      border-radius:12px;
      font-size:13px;
      font-weight:700;
    }

    button{
      width:100%;
      height:50px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg, var(--gv-700), var(--gv-500));
      color:#fff;
      font-weight:900;
      margin-top:18px;
      cursor:pointer;
      font-size:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      box-shadow:var(--shadow-soft);
      transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    button:hover{
      transform:translateY(-1px);
      box-shadow:0 22px 50px rgba(11,107,87,.28);
      filter:saturate(1.05);
    }

    button:active{
      transform:translateY(0);
    }

    .foot{
      margin-top:14px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
    }

    @media (max-width:520px){
      .card{
        padding:72px 22px 24px;
      }

      .brand{
        top:10px;
        right:10px;
        padding:6px 8px;
      }

      h1{
        font-size:28px;
      }
    }
  </style>
</head>

<body>

  <div class="brand">
    <img src="{% static 'img/ge_vernova.png' %}" alt="GE Vernova">
  </div>

  <div class="card">
    <div class="hero-icon" aria-hidden="true">
      GV
    </div>
    <div class="pill">GEVERNOVA PROJETOS</div>

    <h1>GV_PROJ</h1>
    <div class="sub">Selecione o email e digite a senha.</div>

    <form method="post" novalidate>
      {% csrf_token %}

      <div class="field">
        <label>Email</label>
        {{ form.username }}
      </div>

      <div class="field">
        <label>Senha</label>
        {{ form.password }}
      </div>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <button type="submit" aria-label="Entrar com email">
        <span aria-hidden="true">&#9993;</span>
        Entrar com Email
      </button>
    </form>

    <div class="foot">A criação de usuários será feita dentro do painel do ADMIN.</div>
  </div>

</body>
</html>
